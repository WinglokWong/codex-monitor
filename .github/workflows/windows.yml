name: Windows build and tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Windows/**'
      - 'Assets/AppIcon.ico'
      - 'Assets/AppIcon.png'
      - '.github/workflows/windows.yml'

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - name: Build, test, render and package Windows x64
        shell: pwsh
        run: ./Windows/build-release.ps1
      - name: Upload Windows package and validation output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: codex-monitor-windows-x64
          path: |
            Windows/artifacts/*.zip
            Windows/artifacts/*.txt
            Windows/artifacts/*.png
            Windows/artifacts/*.json
          if-no-files-found: warn
          retention-days: 14
          compression-level: 0
